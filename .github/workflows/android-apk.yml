name: Android APK
# Builds the NexEase Android app and publishes the APK as a GitHub pre-release
# (Releases → "NexEase Android …") and refreshes "android-latest", the file the website's
# download page links to. Runs when the app changes on main, when the mobile branch or an
# apk-v* tag is pushed, or manually from Actions → "Android APK" → Run workflow.
# A signed release APK is built when the signing secrets exist; otherwise a debug APK
# (installs directly, but cannot later be updated by a signed build without reinstalling).
on:
  push:
    branches: [main, feature/mobile-app]
    tags: ['apk-v*']
    paths: ['frontend/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API address baked into the app
        required: true
        default: https://nexease-backend-singapore.onrender.com/api/v1
      build_type:
        description: auto picks release when signing secrets exist, else debug
        required: true
        default: auto
        type: choice
        options: [auto, debug, release]
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_url || 'https://nexease-backend-singapore.onrender.com/api/v1' }}
      # Continues the existing app's version 7 so a new build can update an installed one.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide build type
        id: kind
        env:
          REQUESTED: ${{ inputs.build_type || 'auto' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$REQUESTED" = "auto" ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then type=release; else type=debug; fi
          else
            type="$REQUESTED"
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Building a $type APK"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Build the web app for mobile
        run: npm run mobile:build
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build debug APK
        if: steps.kind.outputs.type == 'debug'
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PnexeaseVersionCode=$((100 + VERSION_CODE))
      - name: Build signed release APK
        if: steps.kind.outputs.type == 'release'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first, or run a debug build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PnexeaseVersionCode=$((100 + VERSION_CODE)) \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Name the APK
        id: apk
        run: |
          mkdir -p ../apk
          src=$(ls android/app/build/outputs/apk/${{ steps.kind.outputs.type }}/*.apk | head -1)
          name="NexEase-${{ steps.kind.outputs.type }}-$((100 + VERSION_CODE)).apk"
          cp "$src" "../apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la ../apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexEase-${{ steps.kind.outputs.type }}-apk
          path: apk/*.apk
          retention-days: 30
      - name: Publish as a GitHub pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE: ${{ steps.kind.outputs.type }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          version=$((100 + VERSION_CODE))
          tag="android-$version"
          notes="NexEase Android build $version ($TYPE) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}.
          Backend: $NEXT_PUBLIC_API_BASE_URL
          Install: download $NAME on the phone and open it (allow installs from this source when Android asks)."
          gh release create "$tag" "apk/$NAME" --target "$GITHUB_SHA" --prerelease \
            --title "NexEase Android $version ($TYPE)" --notes "$notes"
      - name: Update the website download (android-latest)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          # The website download page links to releases/download/android-latest/NexEase.apk; keep it current.
          cp "apk/$NAME" apk/NexEase.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "NexEase Android (latest)" \
            --notes "The newest NexEase Android build, as linked from the website. Older builds are kept as android-<version>." --target "$GITHUB_SHA"
          gh release upload android-latest apk/NexEase.apk --clobber
